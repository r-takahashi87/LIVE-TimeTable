<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ライブタイムテーブルを組もう！</title>

<style>
    table{
        /*隣り合うマスの枠線を一本にする*/ border-collapse:collapse;
        /*表の下に空白*/ margin-bottom:10px;
    }
    th,td{
        /*枠線：1pxの太さ　直線*/ border: 1px solid;
    }
    th{
        background-color: gray;
    }
</style>

</head>

<body>
    <h1>ライブタイムテーブルを組もう！</h1>

    <!--入力フォーム-->
        <h2>新規バンド登録</h2>
        <form id="bandform">
            <div>
                <label>バンド名</label>
                <input type="text" id="bandname" required>
            </div>
            <div>
                <label>演奏時間</label>
                <input type="text" id="performancetime" placeholder="半角数字" required>
            </div>
            <div>
                <label>メンバー</label>
                <input type="text" id="member" placeholder="全角読点「、」で区切る"　required>
            </div>
            <button type="submit">バンドを追加</button>
        </form>
    
    <!--バンド一覧-->
        <h2>バンド一覧</h2>
        <table id="bandlist">
            <thead>
                <tr>
                    <th>バンド名</th>
                    <th>演奏時間</th>
                    <th>メンバー</th>
                    <th>削除</th>
                </tr>
            </thead>
            <tbody id="bandlist-body"></tbody>
        </table>
    
    <!--実行-->
        <button id="TTmake">タイムテーブルを作成する</button>

    <!--タイムテーブル表示-->
        <h2>タイムテーブル</h2><h5>*転換２分含む</h5>
        <table id="timetable">
            <tbody></tbody>
        </table>

    <script src="mission 6-2.js"></script>
</body>
</html>
